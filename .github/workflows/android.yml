name: DIVlauncher CI

on:
  pull_request:
    types: [ opened, reopened ]
  push:
    branches: [ '**' ]
    tags: [ 'v*', 'DIVlauncher-v*' ]
  workflow_dispatch:

# Needed to publish GitHub Releases with the GITHUB_TOKEN
permissions:
  contents: write

env:
  # Bump this to force the Java runtimes to be downloaded and repacked again
  JRE_REV: "20260404-1"
  JRE_RELEASES: "https://github.com/AngelAuraMC/angelauramc-openjdk-build/releases/download"

jobs:
  build:
    name: Build ${{ matrix.abi }}
    runs-on: ubuntu-22.04
    env:
      # Builds that become a published release get the clean version number (no "-dev.<commit>" suffix)
      DIV_RELEASE_BUILD: ${{ (github.ref_type == 'tag' || (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch)) && 'true' || 'false' }}
      # Public HTTPS proxy URL only; the private CurseForge API key stays on the proxy host.
      CURSEFORGE_PROXY_BASE_URL: ${{ vars.CURSEFORGE_PROXY_BASE_URL }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { abi: arm64-v8a,   arch: arm64 }
          - { abi: armeabi-v7a, arch: arm }
          - { abi: x86_64,      arch: x86_64 }
          - { abi: x86,         arch: x86 }
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "recursive"
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      # Pinned to one LTW release and verified by checksum, so a changed or tampered "latest" can never
      # silently end up in the APK. To upgrade: change both values below together.
      - name: Get LTW (pinned)
        env:
          LTW_TAG: "7703f1c"
          LTW_SHA256: "5640b2aecd99a3ad174bfbd959c4bf30bf1f57139f7ba9b5d62cb621ff55322a"
        run: |
          mkdir -p app_pojavlauncher/libs
          curl -fL --retry 5 -o app_pojavlauncher/libs/ltw-release.aar \
            "https://github.com/PojavLauncherTeam/LTW/releases/download/${LTW_TAG}/ltw-release.aar"
          echo "${LTW_SHA256}  app_pojavlauncher/libs/ltw-release.aar" | sha256sum -c -

      # Java 8, 17 and 21 for this CPU architecture, repacked into the layout the app unpacks on first start
      - name: Cache Java runtimes
        id: jre-cache
        uses: actions/cache@v4
        with:
          path: runtimes
          key: jre-${{ env.JRE_REV }}-${{ matrix.arch }}-${{ hashFiles('scripts/repack_jre.py') }}

      - name: Download and repack Java runtimes
        if: steps.jre-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p dl runtimes
          for v in 8 17 21; do
            for a in arm arm64 x86 x86_64; do
              curl -fL --retry 5 -o "dl/jre$v-$a.tar.xz" "$JRE_RELEASES/download_jre$v/jre$v-android-$a.tar.xz"
            done
          done
          repack() { # repack <java version> <output folder>
            python3 scripts/repack_jre.py "runtimes/$2" "div-jre$1-$JRE_REV" \
              arm="dl/jre$1-arm.tar.xz" arm64="dl/jre$1-arm64.tar.xz" \
              x86="dl/jre$1-x86.tar.xz" x86_64="dl/jre$1-x86_64.tar.xz" \
              --only-arch "${{ matrix.arch }}"
          }
          repack 8 jre
          repack 17 jre-new
          repack 21 jre-21

      - name: Install Java runtimes into the app
        run: |
          mkdir -p app_pojavlauncher/src/main/assets/components
          cp -r runtimes/. app_pojavlauncher/src/main/assets/components/
          ls -lh app_pojavlauncher/src/main/assets/components/*

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"  # keep equal to gradle/wrapper/gradle-wrapper.properties

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DIVlauncher-${{ matrix.abi }}
          path: app_pojavlauncher/build/outputs/apk/debug/*.apk

      - name: Build release APK
        if: startsWith(github.ref, 'refs/tags/')
        run: ./gradlew assembleRelease

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app_pojavlauncher/build/outputs/apk/release/*.apk
