name: DIVlauncher Windows Desktop

on:
  push:
    branches: ["**"]
    tags: ["v*", "DIVlauncher-v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate desktop sources
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check frontend JavaScript syntax
        shell: pwsh
        run: node --check desktop/ui/app.js

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: Run core tests
        working-directory: desktop
        run: cargo test -p divcore

      - name: Check Tauri backend
        working-directory: desktop
        run: cargo check -p divlauncher

  package:
    name: Build Windows installer
    runs-on: windows-latest
    needs: validate
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build NSIS installer
        working-directory: desktop
        run: cargo tauri build --bundles nsis

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: DIVlauncher-Windows-Installer
          path: desktop/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
