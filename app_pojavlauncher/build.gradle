plugins {
    id 'com.android.application' version '8.7.2'
}

static def getDate() { return new Date().format('yyyyMMdd') }

static def getDateSeconds() {
    if (System.getenv("GITHUB_ACTIONS") == "true") {
        return 9934841 + Integer.parseInt(System.getenv("GITHUB_RUN_NUMBER"))
    } else {
        return 172005
    }
}

// App version shown in Android's app info. Our own scheme (no upstream codenames, no git calls):
//   tag build, e.g. DIVlauncher-v1.2.0 or v1.2.0  -> 1.2.0
//   build published as the "Latest" release        -> <divVersion>
//   any other CI build (branches, pull requests)   -> <divVersion>-dev.<7-char commit>
//   local build                                    -> <divVersion>-local
// <divVersion> is set in gradle.properties.
def getVersionName = {
    String base = project.hasProperty('divVersion') ? project.property('divVersion').toString().trim() : '1.0.0'
    String refType = System.getenv("GITHUB_REF_TYPE")
    String refName = System.getenv("GITHUB_REF_NAME")
    String sha = System.getenv("GITHUB_SHA")
    if (refType == "tag" && refName != null && !refName.trim().isEmpty()) {
        return refName.trim().replaceFirst(/(?i)^(DIVlauncher-)?v?/, '')
    }
    if ("true".equals(System.getenv("DIV_RELEASE_BUILD"))) return base
    if (sha != null && sha.length() >= 7) return base + '-dev.' + sha.substring(0, 7)
    return base + '-local'
}

def getElyByOAuthConfig = { String envName, String propertyName ->
    String value = System.getenv(envName)
    if (value == null && project.hasProperty(propertyName)) value = project.property(propertyName).toString()
    return value == null ? "" : value.trim()
}

def escapeBuildConfigString = { String value ->
    return '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"'
}

def elyByOAuthClientId = getElyByOAuthConfig('ELYBY_OAUTH_CLIENT_ID', 'elybyOAuthClientId')
def elyByOAuthClientSecret = getElyByOAuthConfig('ELYBY_OAUTH_CLIENT_SECRET', 'elybyOAuthClientSecret')

// SECURITY: anything compiled into an APK can be extracted by whoever downloads it. The Ely.by client
// secret is therefore allowed in debug/private builds only. A release/bundle build that would embed it
// is refused unless the maintainer opts in with -PelybyAllowSecretInRelease=true. The proper fix for
// public releases is a small backend that exchanges the OAuth code and keeps the secret server-side.
def elyByAllowSecretInRelease = project.hasProperty('elybyAllowSecretInRelease') &&
        project.property('elybyAllowSecretInRelease').toString() == 'true'
gradle.taskGraph.whenReady { graph ->
    boolean buildsRelease = graph.allTasks.any { task ->
        task.name ==~ /(?i)(assemble|bundle|package)\w*release\w*/
    }
    if (buildsRelease && !elyByOAuthClientSecret.isEmpty() && !elyByAllowSecretInRelease) {
        throw new GradleException('Refusing to build a release APK that embeds ELYBY_OAUTH_CLIENT_SECRET: ' +
                'the secret could be extracted from the APK. Unset it for release builds, or pass ' +
                '-PelybyAllowSecretInRelease=true if you accept that risk.')
    }
}

def getCFProxyBaseUrl = {
    // Public proxy URL only; NEVER package the private CurseForge API key in the APK.
    String value = System.getenv("CURSEFORGE_PROXY_BASE_URL")
    if (value == null && project.hasProperty("curseforgeProxyBaseUrl")) value = project.property("curseforgeProxyBaseUrl")
    value = value == null ? "" : value.trim()
    while (value.endsWith("/")) value = value.substring(0, value.length() - 1)
    if (!value.isEmpty() && (!value.startsWith("https://") || !value.endsWith("/v1"))) {
        logger.warn('BUILD: CURSEFORGE_PROXY_BASE_URL must be an HTTPS proxy base ending in /v1; CurseForge integration disabled.')
        return ""
    }
    if (value.isEmpty()) logger.lifecycle('BUILD: CurseForge integration disabled until an HTTPS server-side API proxy is configured.')
    return value
}

configurations {
    instrumentedClasspath {
        canBeConsumed = false
        canBeResolved = true
    }
}

android {
    namespace 'net.kdt.pojavlaunch'

    compileSdk = 34

    lintOptions {
        abortOnError false
        checkReleaseBuilds false
    }

    signingConfigs {
        customDebug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        release {
            // Optional: set these env vars (e.g. GitHub Actions secrets) to sign release builds.
            def ksFile = System.getenv("DIV_KEYSTORE_FILE")
            if (ksFile) {
                storeFile file(ksFile)
                storePassword System.getenv("DIV_KEYSTORE_PASSWORD")
                keyAlias System.getenv("DIV_KEY_ALIAS")
                keyPassword System.getenv("DIV_KEY_PASSWORD")
            }
        }
    }

    defaultConfig {
        applicationId "com.div.divlauncher"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode getDateSeconds()
        versionName getVersionName()
        multiDexEnabled true //important
        resValue 'string', 'curseforge_proxy_base_url', getCFProxyBaseUrl()
        // Ely.by's OAuth website login is enabled only for builds with a registered app.
        // Credentials are passed in at build time; never commit them to source control.
        buildConfigField 'String', 'ELYBY_OAUTH_CLIENT_ID', escapeBuildConfigString(elyByOAuthClientId)
        buildConfigField 'String', 'ELYBY_OAUTH_CLIENT_SECRET', escapeBuildConfigString(elyByOAuthClientSecret)

        // CI builds one APK per CPU architecture: -PdivAbi=arm64-v8a
        if (project.hasProperty('divAbi')) {
            ndk {
                abiFilters project.property('divAbi')
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.customDebug
            resValue 'string', 'application_package', 'com.div.divlauncher.debug'
            resValue 'string', 'storageProviderAuthorities', 'com.div.divlauncher.scoped.gamefolder.debug'
            resValue 'string', 'shareProviderAuthority', 'com.div.divlauncher.scoped.controlfolder.debug'
        }
        proguard {
            initWith debug
            minifyEnabled true
            shrinkResources true
        }
        proguardNoDebug {
            initWith proguard
            debuggable false
        }

        release {
            // Don't set to true or java.awt will be a.a or something similar.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (System.getenv("DIV_KEYSTORE_FILE")) {
                signingConfig signingConfigs.release
            } else {
                // No release key configured: sign with the shared test key so the APK still installs.
                // Fine for testing; set the DIV_* secrets (see README) before a public release.
                signingConfig signingConfigs.customDebug
                logger.warn('BUILD: DIV_KEYSTORE_FILE not set, signing the release APK with the shared test key.')
            }
            // defaultConfig already set
            // multiDexEnabled = true
            // debuggable = true
            resValue 'string', 'storageProviderAuthorities', 'com.div.divlauncher.scoped.gamefolder'
            resValue 'string', 'application_package', 'com.div.divlauncher'
        }
    }

    ndkVersion = "25.2.9519653"

    externalNativeBuild {
        ndkBuild {
            path file('src/main/jni/Android.mk')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    bundle {
        language {
            enableSplit = false
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
        pickFirst '**/libbytehook.so'
    }

    buildFeatures {
        prefab true
        buildConfig true
    }

    buildToolsVersion = '34.0.0'
}

afterEvaluate {
    // Explicit dependencies for which the apk relies on
    tasks.mergeDebugAssets.dependsOn(":forge_installer:jar", ":arc_dns_injector:jar", ":jre_lwjgl3glfw:jar")
    tasks.mergeReleaseAssets.dependsOn(":forge_installer:jar", ":arc_dns_injector:jar", ":jre_lwjgl3glfw:jar")
}

