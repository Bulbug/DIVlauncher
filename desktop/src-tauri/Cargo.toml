[package]
name = "divlauncher"
version = "1.0.0"
edition = "2021"
description = "DIVlauncher for Windows"
license = "LGPL-3.0-only"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
divcore = { path = "../core" }
